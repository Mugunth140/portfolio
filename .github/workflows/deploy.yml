# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  GitHub Actions CI/CD Pipeline                                               ║
# ║  Build → Push to Docker Hub → Deploy to Azure VM                             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build and Push Docker Image
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build arguments for optimization
          build-args: |
            NODE_ENV=production

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy to Azure VM
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_EMAIL_FROM: ${{ secrets.CONTACT_EMAIL_FROM }}
          CONTACT_EMAIL_TO: ${{ secrets.CONTACT_EMAIL_TO }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << 'ENDSSH'
            # Navigate to project directory
            cd ~/portfolio || mkdir -p ~/portfolio && cd ~/portfolio

            # Create/update docker-compose.yml
            cat > docker-compose.yml << 'EOF'
          version: '3.8'

          services:
            nextjs:
              image: $DOCKERHUB_USERNAME/portfolio:latest
              container_name: portfolio-nextjs
              restart: unless-stopped
              environment:
                - NODE_ENV=production
                - RESEND_API_KEY=$RESEND_API_KEY
                - CONTACT_EMAIL_FROM=$CONTACT_EMAIL_FROM
                - CONTACT_EMAIL_TO=$CONTACT_EMAIL_TO
              networks:
                - portfolio-network
              deploy:
                resources:
                  limits:
                    memory: 200M
                  reservations:
                    memory: 100M

            nginx:
              image: nginx:alpine
              container_name: portfolio-nginx
              restart: unless-stopped
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
                - /etc/letsencrypt:/etc/letsencrypt:ro
                - /var/www/certbot:/var/www/certbot:ro
              depends_on:
                - nextjs
              networks:
                - portfolio-network
              deploy:
                resources:
                  limits:
                    memory: 20M
                  reservations:
                    memory: 5M

          networks:
            portfolio-network:
              driver: bridge
          EOF

            # Substitute environment variables
            export DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME"
            export RESEND_API_KEY="$RESEND_API_KEY"
            export CONTACT_EMAIL_FROM="$CONTACT_EMAIL_FROM"
            export CONTACT_EMAIL_TO="$CONTACT_EMAIL_TO"
            envsubst < docker-compose.yml > docker-compose.tmp && mv docker-compose.tmp docker-compose.yml

            # Pull latest images
            docker compose pull

            # Restart services with zero-downtime
            docker compose up -d --remove-orphans

            # Clean up old images
            docker image prune -af

            # Show status
            docker compose ps
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ─────────────────────────────────────────────────────────────────────────────
  # Health Check
  # ─────────────────────────────────────────────────────────────────────────────
  healthcheck:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check site is up
        run: |
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://mugunth.live || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Site is up and running!"
              exit 0
            fi
            echo "Attempt $i: Status $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "❌ Site health check failed"
          exit 1
